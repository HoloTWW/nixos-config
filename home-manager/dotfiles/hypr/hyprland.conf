# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

debug {
    disable_logs = false
}

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,1920x1080@60,auto,1.0
# monitor=,preferred,auto,1

monitor=Virtual-1,1920x1080@144,0x0,1
monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,preferred,auto,0.5
# monitor=HDMI-A-1,1920x1080@60,1920x0,1


# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = fuzzel

# Please note not all available settings / options are set here.
# For a full list, see the wiki

source = ~/.config/hypr/configs/binds.conf
source = ~/.config/hypr/configs/env.conf
source = ~/.config/hypr/configs/execs.conf
source = ~/.config/hypr/configs/input.conf
source = ~/.config/hypr/configs/theme.conf
source = ~/.config/hypr/configs/windowrules.conf
source = ~/.config/hypr/configs/workspaces.conf



